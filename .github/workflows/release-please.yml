name: Release

# Release Please keeps a release pull request open while conventional commits land on master. Merging that
# pull request tags the version, publishes the GitHub release and updates CHANGELOG.md and every version field
# (see release-please-config.json). The installer job then builds the Windows installer and attaches it.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    name: Build and attach the installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The bundled dictionaries' licences must be present when the notices are generated.
      - name: Fetch the spelling dictionaries
        run: npm run fetch-dictionary

      # beforeBuildCommand regenerates THIRD-PARTY-NOTICES.txt and builds the front end.
      - name: Build the installer
        run: npx tauri build

      - name: Attach the installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" src-tauri/target/release/bundle/nsis/*-setup.exe --clobber
