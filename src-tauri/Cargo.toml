[package]
name = "k-doc"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "K-Doc desktop host: the Tauri shell and filesystem adapter for the K-Doc Markdown word processor."
authors = ["K-Tech Labs"]
homepage = "https://ktechlabs.au"
repository = "https://github.com/K-Tech-Labs-Australia/K-Doc"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
spellbook = "0.4.2"
trash = "5.2.9"
